name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.8", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/ci.txt
      - name: Install locked third-party wheels
        run: python -m pip install --only-binary=:all: --require-hashes -r requirements/ci.txt
      # This is our checked-out source. Build it with the locked backend only.
      - run: python -m pip install --only-binary=:all: --no-deps --no-build-isolation -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest --cov=idm_cli --cov-report=term-missing
