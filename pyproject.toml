[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "idm-cli"
version = "1.3.4"
description = "A lightning-fast, universal command-line download manager"
readme = "README.md"
# Table form (not the PEP 639 SPDX string) on purpose: the SPDX string needs
# setuptools >= 77, but setuptools dropped Python 3.8 support at 75.3, so the
# 3.8 CI jobs could never install the package. The table form works on
# setuptools 64-84 and therefore on every Python in the CI matrix.
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [
    { name = "Rehan" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
]
dependencies = [
    "typer",
    "rich",
    "curl-cffi>=0.7.0",
    "aiofiles",
    "yt-dlp",
    "pyfiglet",
    "questionary",
    "psutil",
    "platformdirs",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "packaging",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/rj41-w2/idm-cli"

[project.scripts]
idm = "idm_cli.ui.cli:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
